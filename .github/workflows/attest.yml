name: attest-test
on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: push-to-registry value
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
  attestations: write
env:
  JF_URL: https://hts1.jfrog.io
  REPO: evd449691-docker-local
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jfrog/setup-jfrog-cli@v4
        id: jfrog
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: evd449691-github
      - name: debug v2
        env:
          U: ${{ steps.jfrog.outputs.oidc-user }}
          T: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          echo "user length: ${#U}"
          curl -si -u "$U:$T" https://hts1.jfrog.io/v2/ | head -20
          curl -si -H "Authorization: Bearer $T" https://hts1.jfrog.io/artifactory/api/system/ping | head -10
      - uses: docker/login-action@v3
        with:
          registry: hts1.jfrog.io
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: hts1.jfrog.io/${{ env.REPO }}/attest-test:${{ github.run_id }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: hts1.jfrog.io/${{ env.REPO }}/attest-test
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: ${{ inputs.push_to_registry }}
