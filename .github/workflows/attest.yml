name: attest-test
on:
  workflow_dispatch:
    inputs:
      subject_name:
        description: full subject-name (blank = registry host form)
        type: string
        default: ""
      push_to_registry:
        description: push-to-registry value
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
  attestations: write
env:
  JF_URL: https://hts1.jfrog.io
  REPO: evd449691-docker-local
  REG: hts1-evd449691-docker-local.jfrog.io
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jfrog/setup-jfrog-cli@v4
        id: jfrog
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          oidc-provider-name: evd449691-github
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REG }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REG }}/attest-test:${{ github.run_id }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ inputs.subject_name != '' && inputs.subject_name || format('{0}/attest-test', env.REG) }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: ${{ inputs.push_to_registry }}
